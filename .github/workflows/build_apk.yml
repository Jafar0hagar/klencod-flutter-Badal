name: Build Badal Mobile Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: |
          if [ -d "badal_mobile_app" ]; then
            cd badal_mobile_app
          fi
          flutter pub get

      - name: 🚀 Build Release APK
        run: |
          if [ -d "badal_mobile_app" ]; then
            cd badal_mobile_app
          fi
          flutter build apk --release --no-tree-shake-icons

      - name: 📤 Upload Badal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: badal-app-release.apk
          path: |
            badal_mobile_app/build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
